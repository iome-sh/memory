# CI for github.com/iome-sh/memory (Palace kernel).
# Required gate: lint · test · qdrant-integration · build · govulncheck · ci-success.
# Heavy LongMemEval/ONNX remain optional (workflow_dispatch only).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_longmemeval:
        description: "Also run LongMemEval/ONNX gates (needs network + models)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Module verify
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./... -count=1 -timeout=10m

  # Optional race — not required for ci-success (hugot/embedding paths can be slow under -race).
  test-race:
    name: test-race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test ./... -race -count=1 -timeout=15m

  # Qdrant integration test against a pinned service container. Red if the
  # test fails, is skipped, or does not run.
  qdrant-integration:
    name: qdrant-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2 # matches github.com/qdrant/go-client v1.19.x
        ports:
          - 6333:6333
          - 6334:6334
    env:
      MEMORY_QDRANT_TEST_URL: http://localhost:6334
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (Qdrant integration)
        run: |
          set -o pipefail
          go test . -run '^TestVectorStore_WithTemporaryQdrant$' -v -count=1 -timeout=5m 2>&1 | tee /tmp/qdrant-test.log
          if grep -q -- '--- SKIP' /tmp/qdrant-test.log; then
            echo "::error::Qdrant integration test was skipped in CI"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestVectorStore_WithTemporaryQdrant' /tmp/qdrant-test.log; then
            echo "::error::Qdrant integration test did not run"
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build packages
        run: |
          go build ./...
          go build -o /tmp/longmemeval-bench ./cmd/longmemeval-bench
          go build -o /tmp/longmemeval-server ./cmd/longmemeval-server

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Aggregate gate for branch protection (single required check name).
  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, qdrant-integration, build, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "qdrant-integration=${{ needs.qdrant-integration.result }}"
          echo "build=${{ needs.build.result }}"
          echo "govulncheck=${{ needs.govulncheck.result }}"
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.qdrant-integration.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.govulncheck.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (got $r)"
              exit 1
            fi
          done
          echo "All required CI jobs passed."

  # Optional heavy gates — workflow_dispatch only (models/network).
  longmemeval:
    name: longmemeval-optional
    if: github.event_name == 'workflow_dispatch' && inputs.run_longmemeval == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-onnx
        run: make test-onnx
      - name: make longmemeval-recall-gate
        run: make longmemeval-recall-gate
      - name: make longmemeval-bench
        run: make longmemeval-bench
