# CI for github.com/iome-sh/memory (Palace kernel).
# Required gate: lint · test · build · govulncheck · ci-success.
# Heavy LongMemEval/ONNX remain optional (workflow_dispatch only).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_longmemeval:
        description: "Also run LongMemEval/ONNX gates (needs network + models)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module verify
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./... -count=1 -timeout=10m

      # Optional race on pure-Go default path (no mandatory ONNX/ORT). Soft: do not require CGO.
      - name: go test -race (default pure packages)
        run: go test ./... -race -count=1 -timeout=15m
        continue-on-error: true

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build packages
        run: |
          go build ./...
          go build -o /tmp/longmemeval-bench ./cmd/longmemeval-bench
          go build -o /tmp/longmemeval-server ./cmd/longmemeval-server

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Aggregate gate for branch protection (single required check name).
  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, build, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "build=${{ needs.build.result }}"
          echo "govulncheck=${{ needs.govulncheck.result }}"
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.govulncheck.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "::error::CI gate failed (got $r)"
              exit 1
            fi
          done
          echo "All required CI jobs passed."

  # Optional heavy gates — workflow_dispatch only (models/network).
  longmemeval:
    name: longmemeval-optional
    if: github.event_name == 'workflow_dispatch' && inputs.run_longmemeval == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: make test-onnx
        run: make test-onnx
      - name: make longmemeval-recall-gate
        run: make longmemeval-recall-gate
      - name: make longmemeval-bench
        run: make longmemeval-bench
