# LongMemEval ONNX smoke gate — workflow_dispatch only (matches aion CI policy).
name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/iome-sh/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make test
        run: make test

      - name: make test-onnx
        run: make test-onnx

      - name: make longmemeval-recall-gate
        run: make longmemeval-recall-gate

      - name: make longmemeval-bench
        run: make longmemeval-bench